spring.message.encoding=UTF-8
server.port=8880
server.error.include-exception=true
spring.jackson.default-property-inclusion=non_null

# mysql默认配置
# mysql需要手动创建数据库，mysql命令行下执行 create database organization_server CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
##*********************** mysql DB begin *************************
spring.datasource.hikari.jdbc-url=jdbc:mysql://127.0.0.1:3306/organization_server?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.hikari.username=root
spring.datasource.hikari.password=123456
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.database=mysql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
##spring.sql.init.mode为always时，每次启动都会初始化resource目录下的data.sql日志，所以需要spring.sql.init.continue-on-error继续执行。
##如果上线，需要spring.sql.init.mode为false，然后手动初始化数据。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.sql.init.continue-on-error=true
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 打印 SQL 初始化日志
#logging.level.org.springframework.jdbc=DEBUG
#logging.level.org.springframework.sql=DEBUG
#logging.level.cn.wildfirechat.org.jpa.config=DEBUG
##*********************** mysql DB end ***************************

# 第二个数据源mysql配置（im-app_server数据库）
##*********************** secondary mysql DB begin *************************
spring.secondary-datasource.hikari.jdbc-url=jdbc:mysql://127.0.0.1:3306/appdata?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.secondary-datasource.hikari.username=root
spring.secondary-datasource.hikari.password=123456
spring.secondary-datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.secondary-datasource.hikari.maximum-pool-size=30
spring.secondary-datasource.hikari.minimum-idle=5
spring.secondary-datasource.hikari.connection-timeout=30000
spring.secondary-datasource.hikari.idle-timeout=600000
spring.secondary-datasource.hikari.max-lifetime=1800000
##*********************** secondary mysql DB end ***************************

# 第三个数据源：野火IM服务自身的库（只读），「今日使用情况」从这里的 t_user_session 取数。
# 注意：这是 IM 服务自己的库（含 t_user_session / t_user / t_messages 等表），
#       不是上面 appdata（im-app_server 的库），两者不要填成同一个。
# 本服务对该库只读：hbm2ddl 固定为 none，且连接池开启了 read-only，不会动 IM 的表结构。
# 不需要「今日使用情况」时把本段整体注释掉即可：服务照常启动，仅该接口返回“服务器配置错误”。
##*********************** IM mysql DB begin *************************
spring.im-datasource.hikari.jdbc-url=jdbc:mysql://127.0.0.1:3306/wfchat?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.im-datasource.hikari.username=root
spring.im-datasource.hikari.password=123456
spring.im-datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.im-datasource.hikari.read-only=true
spring.im-datasource.hikari.maximum-pool-size=10
spring.im-datasource.hikari.minimum-idle=2
spring.im-datasource.hikari.connection-timeout=30000
spring.im-datasource.hikari.idle-timeout=600000
spring.im-datasource.hikari.max-lifetime=1800000
##*********************** IM mysql DB end ***************************

# 「今日使用情况」判定“今日”所用的时区，格式如 Asia/Shanghai，留空则用 JVM 默认时区。
# 服务器/容器时区是 UTC 时必须显式配置，否则“今日”会偏移 8 小时。
# 这里的 Asia/Shanghai 是给国内部署的默认值，非该时区的部署请自行修改。
im.usage.timezone=Asia/Shanghai

# IM 库 t_user_session._dt 的时间单位：seconds / millis / micros / auto（auto=按表里数据量级自动探测）。
# 官方表结构文档没写明该字段单位，此处按客户 IM 库实测值确定：
#   _dt = 1789991913468 -> 2026-09-21 19:58:33（北京时间），13 位，即毫秒。
# 单位写错会让「今日使用情况」把当天记录全部漏掉（按秒处理时 13 位值会被当成公元 5 万多年），
# 因此这里显式写死，同时省掉每次请求探测 max(_dt) 的全表扫描。
# 若换到 _dt 非毫秒的其他 IM 库，改成 auto 会自动重新判断。
im.session.timestamp-unit=millis

